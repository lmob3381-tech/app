name: Build pydantic-core for Termux (armv7 Android)

on:
  workflow_dispatch:
    inputs:
      pydantic_core_version:
        description: "Versi pydantic-core yang mau di-build (kosongkan = terbaru)"
        required: false
        default: ""
      python_version:
        description: "Versi Python target (harus sama dengan `python --version` di Termux)"
        required: false
        default: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pydantic-core source
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-core
          ref: ${{ github.event.inputs.pydantic_core_version != '' && format('v{0}', github.event.inputs.pydantic_core_version) || 'main' }}
          path: pydantic-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install maturin
        run: pip install maturin

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b

      - name: Configure cross-compilation env
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          NDK_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "CC_armv7_linux_androideabi=$NDK_BIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"
          echo "CXX_armv7_linux_androideabi=$NDK_BIN/armv7a-linux-androideabi24-clang++" >> "$GITHUB_ENV"
          echo "AR_armv7_linux_androideabi=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK_BIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"

      - name: Build wheel with maturin
        working-directory: pydantic-core
        run: |
          maturin build \
            --release \
            --target armv7-linux-androideabi \
            --interpreter python${{ github.event.inputs.python_version }} \
            --out dist

      - name: Rename wheel for Termux compatibility
        working-directory: pydantic-core/dist
        run: |
          for f in *.whl; do
            newname=$(echo "$f" | sed 's/linux_armv7l/linux_armv7l/; s/manylinux[^-]*_armv7l/linux_armv7l/')
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi
          done
          ls -la

      - name: Zip the wheel(s)
        run: |
          mkdir -p out
          cp pydantic-core/dist/*.whl out/
          cd out
          zip -r pydantic-core-armv7-termux.zip *.whl

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pydantic-core-armv7-termux
          path: out/pydantic-core-armv7-termux.zip
          retention-days: 30
