name: Web to APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID build dari APK Builder"
        required: true
      url:
        description: "URL website yang akan dibungkus jadi APK"
        required: true
      app_name:
        description: "Nama aplikasi"
        required: true
      package_name:
        description: "Package name Android (com.contoh.app)"
        required: true
      version_name:
        description: "Version name"
        default: "1.0.0"
      version_code:
        description: "Version code"
        default: "1"
      orientation:
        description: "portrait / landscape / unspecified"
        default: "unspecified"
      fullscreen:
        description: "true / false"
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate proyek WebView dari template
        run: |
          python3 templates/android-webview/generate_project.py \
            --url "${{ github.event.inputs.url }}" \
            --app-name "${{ github.event.inputs.app_name }}" \
            --package-name "${{ github.event.inputs.package_name }}" \
            --version-name "${{ github.event.inputs.version_name }}" \
            --version-code "${{ github.event.inputs.version_code }}" \
            --orientation "${{ github.event.inputs.orientation }}" \
            --fullscreen "${{ github.event.inputs.fullscreen }}" \
            --output-dir ./android-build

      - name: Build APK debug
        working-directory: ./android-build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK dengan nama app
        run: |
          mkdir -p ./output
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd '[:alnum:]_-')
          cp ./android-build/app/build/outputs/apk/debug/app-debug.apk "./output/${SAFE_NAME}.apk"

      - name: Buat GitHub Release berisi APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.event.inputs.build_id }}"
          gh release create "$TAG" ./output/*.apk \
            --title "APK Build ${{ github.event.inputs.build_id }}" \
            --notes "Auto-generated APK build. App: ${{ github.event.inputs.app_name }}"

      - name: Hapus release lama (sisakan maksimal 7 terbaru)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ambil semua release dengan prefix "apk-", urut dari yang PALING BARU.
          # Sisakan 7 teratas, hapus sisanya beserta git tag-nya.
          RELEASES=$(gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apk-"))] | sort_by(.createdAt) | reverse | .[].tagName')

          COUNT=0
          for TAG in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt 7 ]; then
              echo "Menghapus release lama: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag || true
            fi
          done
