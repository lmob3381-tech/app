name: Web to APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID build dari APK Builder"
        required: true
      url:
        description: "URL website yang akan dibungkus jadi APK"
        required: true
      app_name:
        description: "Nama aplikasi"
        required: true
      package_name:
        description: "Package name Android (com.contoh.app)"
        required: true
      version_name:
        description: "Version name"
        default: "1.0.0"
      version_code:
        description: "Version code"
        default: "1"
      orientation:
        description: "portrait / landscape / unspecified"
        default: "unspecified"
      fullscreen:
        description: "true / false"
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check - template exists
        run: |
          echo "Isi repo di root:"
          ls -la

          if [ ! -f "templates/android-webview/generate_project.py" ]; then
            echo "::error::File templates/android-webview/generate_project.py TIDAK ditemukan di branch ini."
            echo "::error::Pastikan folder templates/ sudah di-commit dan di-push ke branch main."
            echo "Isi folder templates/ (jika ada):"
            find templates -maxdepth 3 2>/dev/null || echo "  (folder templates/ tidak ada sama sekali)"
            exit 1
          fi

          echo "OK: template generator ditemukan."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate proyek WebView dari template
        run: |
          python3 templates/android-webview/generate_project.py \
            --url "${{ github.event.inputs.url }}" \
            --app-name "${{ github.event.inputs.app_name }}" \
            --package-name "${{ github.event.inputs.package_name }}" \
            --version-name "${{ github.event.inputs.version_name }}" \
            --version-code "${{ github.event.inputs.version_code }}" \
            --orientation "${{ github.event.inputs.orientation }}" \
            --fullscreen "${{ github.event.inputs.fullscreen }}" \
            --output-dir ./android-build

      - name: Generate Gradle wrapper jar
        working-directory: ./android-build
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Build APK debug
        working-directory: ./android-build
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK dengan nama app
        run: |
          mkdir -p ./output
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd '[:alnum:]_-')
          cp ./android-build/app/build/outputs/apk/debug/app-debug.apk "./output/${SAFE_NAME}.apk"

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result-${{ github.event.inputs.build_id }}
          path: ./output/*.apk
          retention-days: 7
          
