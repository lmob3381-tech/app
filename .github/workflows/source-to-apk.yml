name: Source to APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID build dari APK Builder"
        required: true
      app_name:
        description: "Nama aplikasi"
        required: true
      source_zip_path:
        description: "Path file ZIP source di dalam repo (branch temporary)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch (berisi source hasil upload)
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ekstrak source project
        run: |
          mkdir -p ./android-build
          unzip -q "${{ github.event.inputs.source_zip_path }}" -d ./android-build

      - name: Cari gradlew, beri izin eksekusi jika ada
        run: |
          if [ -f ./android-build/gradlew ]; then
            chmod +x ./android-build/gradlew
          fi

      - name: Build APK debug
        working-directory: ./android-build
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Rename APK dengan nama app
        run: |
          mkdir -p ./output
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd '[:alnum:]_-')
          APK_FILE=$(find ./android-build -path "*/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK hasil build tidak ditemukan."
            exit 1
          fi
          cp "$APK_FILE" "./output/${SAFE_NAME}.apk"

      - name: Buat GitHub Release berisi APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.event.inputs.build_id }}"
          gh release create "$TAG" ./output/*.apk \
            --title "APK Build ${{ github.event.inputs.build_id }}" \
            --notes "Auto-generated APK build. App: ${{ github.event.inputs.app_name }}"

      - name: Hapus release lama (sisakan maksimal 7 terbaru)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("apk-"))] | sort_by(.createdAt) | reverse | .[].tagName')

          COUNT=0
          for TAG in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt 7 ]; then
              echo "Menghapus release lama: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag || true
            fi
          done

      - name: Bersihkan file source dari repo
        if: always()
        run: |
          git config user.name "apk-builder-bot"
          git config user.email "apk-builder-bot@users.noreply.github.com"
          git rm -f "${{ github.event.inputs.source_zip_path }}" || true
          git commit -m "chore: bersihkan source setelah build ${{ github.event.inputs.build_id }}" || true
          git push origin HEAD:"${{ github.ref_name }}" || true
          
